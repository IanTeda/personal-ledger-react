<!--
  Entry point HTML file for personal-ledger-react
  This file is the root HTML document for the Vite-built React application.
  It provides the basic structure, meta tags for SEO and responsiveness,
  and includes the script to bootstrap the React app.
-->

<!doctype html>
<!-- Declare HTML5 document type -->
<!-- Set language to English for accessibility and SEO -->
<html lang="en">
  <head>
    <!-- Character encoding for proper text rendering -->
    <meta charset="UTF-8" />
    <!-- Favicon link for browser tab icon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Viewport meta tag for responsive design on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Page title displayed in browser tab -->
    <title>Personal Ledger</title>
  </head>
  <body>
    <!-- Root div where React app is mounted -->
    <div id="root"></div>
    <!-- Script to load and execute the main React application -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
